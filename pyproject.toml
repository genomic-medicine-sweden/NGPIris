[project]
name = "NGPIris"
version = "5.6.9"
readme = "README.md"
dependencies = [
    "bitmath == 1.3.3.1",
    "boto3 == 1.35.81",
    "click >= 8.1.7",
    "parse >= 1.19.1",
    "requests >= 2.31.0",
    "ruff>=0.14.5",
    "tabulate>=0.9.0",
    "tqdm >= 4.66.2",
    "urllib3==2.8.0",
]

requires-python = ">=3.14"

authors = [
    {name = "Erik Brink", email = "erik.brink@gu.se"},
    {name = "Sven Kristian Feddersen", email = "sven.kristian.feddersen@gu.se"}
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["NGPIris", "NGPIris.hci", "NGPIris.hcp", "NGPIris.parse_credentials", "NGPIris.utils", "NGPIris.cli"]

[tool.pytype]
inputs = ["NGPIris"]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
testpaths = [
  "tests"
]
addopts = "--strict-markers"  # Adds command-line options
filterwarnings = "ignore::urllib3.connectionpool.InsecureRequestWarning"

[dependency-groups]
dev = [
    "basedpyright >= 1.33.0",
    "icecream",
    "pylint>=4.0.5",
    "pytest>=9.0.1",
    "ruff >= 0.14.5",
    "shibuya>=2026.7.12",
    "sphinx-autodoc-typehints>=3.13.2",
    "sphinx-click>=6.2.0",
    "sphinx>=9.1.0",
    "typing-extensions>=4.16.0",
]

[project.scripts]
iris = "NGPIris.cli:cli"
iris_generate_credentials_file = "NGPIris.cli:iris_generate_credentials_file"
